 name: Hello World
 on: 
   push: 
     branches: 
       - main
      #-release/** It will trigger the workflow when there is a push to any branch that starts with "release/"
   pull_request:
      branches:
        - main  
 jobs:
   Build:
     runs-on: ubuntu-latest
     steps:
       - name: build step
         run: echo "Hello this a step in Build job"
   Test:
     needs: Build
     runs-on: ubuntu-latest
     steps:
       - name: Test step
         run: echo " this is a step in test job"
   Deploy:
     needs: Test
     runs-on: ubuntu-latest
     steps:
       - name: Deploy step
         run: echo "this is a step in deploy job"
         
   
   
